[project]
name = "finetuneforge-trainer"
version = "0.1.0"
description = "FineTuneForge GPU worker: LoRA fine-tuning with transformers + peft + trl."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "transformers>=5.0",
  "peft>=0.17",
  "trl>=1.0",
  "datasets>=3.0",
  "accelerate>=1.0",
  "huggingface_hub>=0.34",
  "httpx>=0.27",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
modal = ["modal>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a real (tiny) training loop on CPU"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
